plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/palworks.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // See the ICU4J note in dependencies.
    cobblemonDevIcu {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

// Dev runs (runClient/runServer): common's jar holds the access widener, mixins and assets, so it
// has to be part of the palworks mod. Without this, Fabric Loader loads it as a separate nameless
// mod and palworks crashes with "Missing classTweaker file palworks.accesswidener".
loom {
    mods {
        palworks {
            sourceSet sourceSets.main
            modFiles.from(configurations.common)
        }
    }
}

dependencies {
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Cobblemon: compiled against, and loaded in dev runs (see below).
    // Version comes from gradle.properties (cobblemon_version); CI also builds against the newest
    // supported Cobblemon. Non-transitive: Cobblemon's runtime libraries aren't needed to compile.
    modCompileOnly("com.cobblemon:fabric:${rootProject.cobblemon_version}+${rootProject.minecraft_version}") { transitive = false }
    // Dev runs only (runClient/runServer): never part of the published jar or its dependencies.
    modLocalRuntime("com.cobblemon:fabric:${rootProject.cobblemon_version}+${rootProject.minecraft_version}")
    // Cobblemon 1.8.x's battle engine (GraalJS) needs ICU4J 71.1, which Cobblemon bundles. In dev,
    // Gradle would merge it with Minecraft's trimmed ICU4J 73.2 (no DateFormat) and keep only that,
    // so it's added as a plain file, outside version resolution.
    cobblemonDevIcu "com.ibm.icu:icu4j:71.1"
    localRuntime files(configurations.cobblemonDevIcu)
    // spark profiler, for dev runs only (/spark profiler, /spark tps). See CONTRIBUTING.
    modLocalRuntime("maven.modrinth:spark:1.10.109-fabric") { transitive = false }
    // spark bundles this inside its jar, but Loom's mod remapping drops bundled jars.
    modLocalRuntime("me.lucko:fabric-permissions-api:0.3.1") { transitive = false }

    modImplementation("net.fabricmc:fabric-language-kotlin:1.13.8+kotlin.2.3.0")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// In-game tests (GameTests): src/gametest, a separate mod that's only loaded by this run and never
// published. `./gradlew :fabric:runGameTest` boots a headless server with Palworks, Cobblemon and
// the tests, runs them all, and fails the build if any fail. See "Testing" in CONTRIBUTING.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "palworks_gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

// The tests themselves are shared with NeoForge: they live in common/src/gametest (compiled only by
// the loaders' gametest source sets, not by common). This module adds just its fabric.mod.json.
sourceSets.matching { it.name == "gametest" }.configureEach {
    java.srcDir project(":common").file("src/gametest/java")
    resources.srcDir project(":common").file("src/gametest/resources")
}

// JUnit-style report, next to the unit tests' results (CI's test summary reads both)
loom.runs.matching { it.name == "gameTest" }.configureEach {
    vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('test-results/gametest/TEST-gametest.xml').get().asFile}"
}

// Stress test (see StressGameTests and "Performance" in CONTRIBUTING): 200 workers on a big
// farm, with spark measuring tick times. Its own source set and mod (palworks_stress, never
// published), so `./gradlew :fabric:runStressTest` runs it alone, without the in-game tests: Fabric's
// GameTest API runs every test its mods register. It reuses the in-game tests' helpers (Workers,
// Scenes), compiled in but not registered. Writes its results to build/stress/results.json.
sourceSets {
    stress {
        java.srcDir project(":common").file("src/gametest/java")
        java.srcDir project(":common").file("src/stress/java")
        resources.srcDir project(":common").file("src/stress/resources")
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // spark's API, bundled in its jar, to read tick times (spark itself is in dev runs, above).
    // The API classes don't touch Minecraft, so the unremapped jar compiles against them as is.
    stressCompileOnly("maven.modrinth:spark:1.10.109-fabric") { transitive = false }
}

loom {
    mods {
        palworks_stress {
            sourceSet sourceSets.stress
        }
    }
    runs {
        stressTest {
            server()
            name "Stress Test"
            source sourceSets.stress
            runDir "build/run/stressTest"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('test-results/stress/TEST-stress.xml').get().asFile}"
            vmArg "-Dpalworks.stress.report=${layout.buildDirectory.file('stress/results.json').get().asFile}"
        }
    }
}

// A fresh run directory each time (its world, and spark's profile from the last run, go), the EULA
// accepted, as Fabric's GameTest setup does for runGameTest, and spark set up for measuring
tasks.matching { it.name == "runStressTest" }.configureEach {
    doFirst {
        def dir = file("build/run/stressTest")
        delete dir
        dir.mkdirs()
        new File(dir, "eula.txt").text = "eula=true\n"
        // spark: never upload a profile (bytebin is spark's public paste site; nothing listens on
        // port 9), and no background profiler adding to the load being measured
        def spark = new File(dir, "config/spark")
        spark.mkdirs()
        new File(spark, "config.json").text = '{"backgroundProfiler": false, "bytebinUrl": "http://127.0.0.1:9/", "bytesocksHost": "127.0.0.1:9"}\n'
        delete layout.buildDirectory.dir("stress")
    }
}
