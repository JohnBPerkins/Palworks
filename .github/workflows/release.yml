name: Release

# Run from the Actions tab: Release -> Run workflow. The workflow picks the next version from the
# latest vX.Y.Z tag, builds both loaders, creates the tag and GitHub Release, and uploads the jars
# to Modrinth/CurseForge when those are configured. See "Releasing" in .github/CONTRIBUTING.md.
#
# The release job makes the tag; each upload to a mod site is then a publish job of its own. If an
# upload fails (a bad token, the site down), use "Re-run failed jobs" on that run: it uploads the
# same jars under the same version. Running the workflow again would release the next version.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to increase (ignored for the first release, which is 0.1.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: "Release channel shown on Modrinth and CurseForge"
        type: choice
        options: [alpha, beta, release]
        default: alpha
      dry_run:
        description: "Dry run: build and preview the release without tagging or publishing"
        type: boolean
        default: true

# Never run two releases at once; a second one waits instead of racing for the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    # Releases are only cut from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Upload tokens are stored as secrets of this environment, which only main can use.
    environment: release
    permissions:
      contents: write # create the tag and the GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      minecraft: ${{ steps.version.outputs.minecraft }}
      modrinth: ${{ steps.targets.outputs.modrinth }}
      curseforge: ${{ steps.targets.outputs.curseforge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, to find the previous release

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Latest exact vX.Y.Z tag (ignores anything like v1.0.0-rc), compared numerically.
          previous=$(git tag --list --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$previous" ]; then
            version=0.1.0
          else
            IFS=. read -r major minor patch <<< "${previous#v}"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          # A second run on the commit just released is almost always a retry of a failed upload,
          # and would release the same code again as the next version.
          if [ -n "$previous" ] && [ "$(git rev-list -n1 "$previous")" = "$GITHUB_SHA" ]; then
            echo "::error::$previous is already this commit: there's nothing new to release. To retry a failed upload, use 'Re-run failed jobs' on that release's run."
            exit 1
          fi
          minecraft=$(sed -n 's/^minecraft_version *= *//p' gradle.properties)
          {
            echo "version=$version"
            echo "previous=$previous"
            echo "minecraft=$minecraft"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version for Minecraft $minecraft (previous release: ${previous:-none})"

      - name: Check publishing setup
        id: targets
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          HAS_MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN != '' }}
          HAS_CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN != '' }}
        run: |
          # A project ID without its token is a setup mistake, not a reason to quietly skip a site.
          if [ -n "$MODRINTH_ID" ] && [ "$HAS_MODRINTH_TOKEN" != true ]; then
            echo "::error::MODRINTH_PROJECT_ID is set but the MODRINTH_TOKEN secret is missing."
            exit 1
          fi
          if [ -n "$CURSEFORGE_ID" ] && [ "$HAS_CURSEFORGE_TOKEN" != true ]; then
            echo "::error::CURSEFORGE_PROJECT_ID is set but the CURSEFORGE_TOKEN secret is missing."
            exit 1
          fi
          [ -n "$MODRINTH_ID" ] && modrinth=true || modrinth=false
          [ -n "$CURSEFORGE_ID" ] && curseforge=true || curseforge=false
          echo "modrinth=$modrinth" >> "$GITHUB_OUTPUT"
          echo "curseforge=$curseforge" >> "$GITHUB_OUTPUT"
          echo "Modrinth: $modrinth, CurseForge: $curseforge"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Reuse the caches the Build workflow saves on main, but never write them from a release.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Restore Loom project files
        uses: actions/cache/restore@v6
        with:
          path: |
            .gradle/loom-cache
            */.gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', '**/*.accesswidener', '**/accesstransformer.cfg') }}
          restore-keys: |
            loom-${{ runner.os }}-

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -Pmod_version="$VERSION"

      - name: Find jars
        id: jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fabric="fabric/build/libs/palworks-fabric-$VERSION.jar"
          neoforge="neoforge/build/libs/palworks-neoforge-$VERSION.jar"
          for jar in "$fabric" "$neoforge"; do
            if [ ! -f "$jar" ]; then
              echo "::error::Expected $jar was not built."
              ls -la fabric/build/libs neoforge/build/libs
              exit 1
            fi
          done
          echo "fabric=$fabric" >> "$GITHUB_OUTPUT"
          echo "neoforge=$neoforge" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          # Built from main's commit titles since the previous release. Each squash-merged PR is one
          # commit whose title ends in "(#N)", which GitHub turns into a PR link. (GitHub's own
          # generator lists nothing for a first release and depends on commit-to-PR links that a
          # history rewrite breaks.)
          if [ -n "$PREVIOUS" ]; then
            range="$PREVIOUS..HEAD"
            full_changelog="https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...v$VERSION"
          else
            range="HEAD"
            full_changelog="https://github.com/$GITHUB_REPOSITORY/commits/v$VERSION"
          fi
          git log --first-parent --format='%s' "$range" > subjects.txt

          # Only player-facing changes go in the notes (see "PR titles" in CONTRIBUTING.md):
          # feat, fix and perf, plus any type marked breaking with "!". ci/build/docs/test/
          # refactor/chore titles are left out; the full changelog link still lists them.
          #
          # section TITLE PATTERN [-v]: prints "## TITLE" and the titles matching the extended regex
          # PATTERN (or NOT matching it, with -v), with the "type(scope)!: " prefix removed.
          # Prints nothing if no titles qualify.
          section() {
            local items flags=(-iE)
            if [ "${3:-}" = -v ]; then
              flags+=(-v)
            fi
            items=$(grep "${flags[@]}" -- "$2" subjects.txt | sed -E 's/^([A-Za-z]+(\([^)]*\))?!?: *)?/- /' || true)
            if [ -n "$items" ]; then
              printf '## %s\n\n%s\n\n' "$1" "$items"
            fi
          }
          scope='(\([^)]*\))?'
          sections=$(
            section "Breaking changes" "^[A-Za-z]+$scope!: "
            section "Features" "^feat$scope: "
            section "Fixes" "^fix$scope: "
            section "Performance" "^perf$scope: "
            # Titles that don't follow the format at all are shown rather than silently dropped.
            section "Other changes" "^[A-Za-z]+$scope!?: " -v
          )
          {
            if [ -n "$sections" ]; then
              printf '%s\n\n' "$sections"
            else
              printf '_No player-facing changes in this release._\n\n'
            fi
            echo "**Full changelog:** $full_changelog"
          } > release-notes.md

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          MODRINTH: ${{ steps.targets.outputs.modrinth }}
          CURSEFORGE: ${{ steps.targets.outputs.curseforge }}
        run: |
          # In a dry run nothing is published, so describe what a real run would do.
          target() { # $1 = site configured (true/false)
            if [ "$1" != true ]; then
              echo "Skipped (not configured)"
            elif [ "$DRY_RUN" = true ]; then
              echo "Would publish"
            else
              echo "Publishing"
            fi
          }
          {
            if [ "$DRY_RUN" = true ]; then
              echo "## Dry run: nothing was released"
              echo
              echo "This is a preview of **v$VERSION ($CHANNEL)**. Run the workflow again with **Dry run** unticked to release it."
            else
              echo "## Releasing v$VERSION ($CHANNEL)"
              echo
              echo "Each upload to a mod site is a publish job of its own. If one fails, use **Re-run failed jobs** on this run (not the workflow again, which would release the next version)."
            fi
            echo
            echo "| Target | Result |"
            echo "|---|---|"
            echo "| Git tag v$VERSION + GitHub Release | $(target true) |"
            echo "| Modrinth | $(target "$MODRINTH") |"
            echo "| CurseForge | $(target "$CURSEFORGE") |"
            echo
            echo "### Release notes"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          FABRIC_JAR: ${{ steps.jars.outputs.fabric }}
          NEOFORGE_JAR: ${{ steps.jars.outputs.neoforge }}
        run: |
          flags=()
          if [ "$CHANNEL" != release ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" "$FABRIC_JAR" "$NEOFORGE_JAR" \
            --target "$GITHUB_SHA" \
            --title "Palworks $VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"

      # For the publish jobs, and for re-running one that failed
      - name: Collect the release's files
        if: ${{ !inputs.dry_run }}
        env:
          FABRIC_JAR: ${{ steps.jars.outputs.fabric }}
          NEOFORGE_JAR: ${{ steps.jars.outputs.neoforge }}
        run: |
          mkdir release-files
          cp "$FABRIC_JAR" "$NEOFORGE_JAR" release-notes.md release-files/

      - name: Upload the release's files
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error
          retention-days: 30

  # One job per site and loader, so that an upload that fails can be re-run alone ("Re-run failed
  # jobs"): nothing that already went up is uploaded twice, and the version stays the one tagged.
  publish:
    name: publish (${{ matrix.site }}, ${{ matrix.loader }})
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Upload tokens are stored as secrets of this environment, which only main can use.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        site: [modrinth, curseforge]
        loader: [fabric, neoforge]
        include:
          - loader: fabric
            loader_name: Fabric
            dependencies: |
              fabric-api(required)
              architectury-api(required)
              cobblemon(required)
          - loader: neoforge
            loader_name: NeoForge
            dependencies: |
              architectury-api(required)
              cobblemon(required)
              kotlin-for-forge(required)
    steps:
      # A site is skipped until its project ID is configured (see "Check publishing setup").
      - name: Download the release's files
        if: ${{ needs.release.outputs[matrix.site] == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      - name: Publish
        if: ${{ needs.release.outputs[matrix.site] == 'true' }}
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          # Only this job's site is given its ID and token; mc-publish skips a site without them.
          modrinth-id: ${{ matrix.site == 'modrinth' && vars.MODRINTH_PROJECT_ID || '' }}
          modrinth-token: ${{ matrix.site == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ matrix.site == 'curseforge' && vars.CURSEFORGE_PROJECT_ID || '' }}
          curseforge-token: ${{ matrix.site == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
          files: release-files/palworks-${{ matrix.loader }}-${{ needs.release.outputs.version }}.jar
          name: Palworks ${{ needs.release.outputs.version }} (${{ matrix.loader_name }})
          version: ${{ needs.release.outputs.version }}+${{ matrix.loader }}
          version-type: ${{ inputs.channel }}
          changelog-file: release-files/release-notes.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ needs.release.outputs.minecraft }}
          java: 21
          dependencies: ${{ matrix.dependencies }}
