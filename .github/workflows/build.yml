name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels that PR's still-running build, since its result is already outdated.
# Runs on main are never cancelled, so every main commit gets a result and saves the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches the Gradle distribution, dependencies, and Loom's shared files. Only runs on main
      # save this cache; PR runs restore it read-only.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Loom keeps project-specific Minecraft jars (remapped, with our access widener/transformer
      # applied) in .gradle/loom-cache inside the repo, which setup-gradle doesn't cache.
      - name: Cache Loom project files
        uses: actions/cache@v6
        with:
          path: |
            .gradle/loom-cache
            */.gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', '**/*.accesswidener', '**/accesstransformer.cfg') }}
          restore-keys: |
            loom-${{ runner.os }}-

      # `assemble` + `check` is exactly what `build` runs, split so a compile failure and a test
      # failure show up as different steps. No --no-daemon: the second step reuses the warm Gradle
      # daemon from the first, and setup-gradle stops it at the end of the job.
      - name: Build
        run: ./gradlew assemble

      - name: Test
        id: test
        run: ./gradlew check

      # Runs whether the tests passed or failed (but not if the build itself failed), and puts a
      # results table plus each failure's message in the run summary and as PR annotations.
      - name: Test results
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        run: python3 -I .github/scripts/test_summary.py '*/build/test-results/test'

      - name: Upload test reports
        if: ${{ failure() && steps.test.conclusion == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */build/reports/tests/test/
            */build/test-results/test/
          retention-days: 14

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: palworks-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: ignore
