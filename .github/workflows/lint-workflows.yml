name: Lint workflows

# actionlint checks workflow syntax, expressions and action inputs, and runs shellcheck on every
# `run:` script, so mistakes in rarely-run workflows (like Release) surface in review instead of
# at release time.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  # sha256 of actionlint_<version>_linux_amd64.tar.gz from the release's checksums.txt
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # shellcheck is preinstalled on GitHub's Ubuntu runners; actionlint picks it up automatically.
      - name: Lint workflows
        run: |
          shellcheck --version | head -2
          actionlint -color

      - name: Check helper scripts compile
        run: python3 -m py_compile .github/scripts/*.py
