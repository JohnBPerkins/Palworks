version: 2

# Keeps GitHub Actions (checkout, setup-gradle, mc-publish, ...) up to date, including the
# SHA-pinned ones. Gradle and mod dependencies are deliberately not managed here: Minecraft,
# loader and mod versions are tightly coupled, so they're upgraded by hand and tested in-game.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One PR for all action updates instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]
    # Gives PR titles like "ci: bump the github-actions group with 2 updates", which pass the
    # PR title check and stay out of the player-facing release notes.
    commit-message:
      prefix: ci
