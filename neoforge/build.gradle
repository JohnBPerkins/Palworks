plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/palworks.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // Only serves Kotlin for Forge; limited to its group like the mod repos in the root build.gradle.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Kotlin for Forge'
                url = 'https://thedarkcolour.github.io/KotlinForForge/'
            }
        }
        filter { includeGroup 'thedarkcolour' }
    }
}

dependencies {
    mappings loom.officialMojangMappings()

    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Cobblemon: compiled against, and loaded in dev runs (see below).
    // Version comes from gradle.properties (cobblemon_version); see common/build.gradle.
    modCompileOnly("com.cobblemon:neoforge:${rootProject.cobblemon_version}+${rootProject.minecraft_version}") { transitive = false }
    // Dev runs only (runClient/runServer): never part of the published jar or its dependencies.
    modLocalRuntime("com.cobblemon:neoforge:${rootProject.cobblemon_version}+${rootProject.minecraft_version}")
    // Cobblemon is written in Kotlin; on NeoForge the Kotlin runtime comes from Kotlin for Forge.
    // The Modrinth jar (what players install) bundles Kotlin so NeoForge loads it for mods; the
    // Maven artifact pulls Kotlin in as plain jars, which Cobblemon can't see. localRuntime, not
    // modLocalRuntime: Loom's mod remapping drops the bundled jars, and it needs no remapping.
    localRuntime("maven.modrinth:kotlin-for-forge:5.12.0") { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
