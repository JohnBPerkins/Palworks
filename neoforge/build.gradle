plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/palworks.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // Only serves Kotlin for Forge; limited to its group like the mod repos in the root build.gradle.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Kotlin for Forge'
                url = 'https://thedarkcolour.github.io/KotlinForForge/'
            }
        }
        filter { includeGroup 'thedarkcolour' }
    }
}

dependencies {
    mappings loom.officialMojangMappings()

    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Cobblemon: compiled against, and loaded in dev runs (see below).
    // Version comes from gradle.properties (cobblemon_version); see common/build.gradle.
    modCompileOnly("com.cobblemon:neoforge:${rootProject.cobblemon_version}+${rootProject.minecraft_version}") { transitive = false }
    // Dev runs only (runClient/runServer): never part of the published jar or its dependencies.
    modLocalRuntime("com.cobblemon:neoforge:${rootProject.cobblemon_version}+${rootProject.minecraft_version}")
    // Cobblemon is written in Kotlin; on NeoForge the Kotlin runtime comes from Kotlin for Forge.
    // The Modrinth jar (what players install) bundles Kotlin so NeoForge loads it for mods; the
    // Maven artifact pulls Kotlin in as plain jars, which Cobblemon can't see. localRuntime, not
    // modLocalRuntime: Loom's mod remapping drops the bundled jars, and it needs no remapping.
    localRuntime("maven.modrinth:kotlin-for-forge:5.12.0") { transitive = false }
    // spark profiler, for dev runs only (/spark profiler, /spark tps). See CONTRIBUTING. Already
    // uses NeoForge's names, so it needs no remapping.
    localRuntime("maven.modrinth:spark:1.10.124-neoforge-1.21.1") { transitive = false }

    // Cobblemon's classes carry Kotlin annotations (@Deprecated(level = WARNING)); without the
    // stdlib to resolve them javac warns, and warnings fail the build. Compile only: Kotlin for
    // Forge provides it at runtime.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.9.21"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// In-game tests (GameTests), the same ones Fabric runs: the tests live in common/src/gametest,
// this module adds only the small mod that registers them (src/gametest). Dev runs only, never
// published. `./gradlew :neoforge:runGameTest` boots a headless server with Palworks, Cobblemon and
// the tests, runs them all, and exits non-zero if any fail. See "Automated tests" in CONTRIBUTING.
sourceSets {
    gametest {
        java.srcDir project(":common").file("src/gametest/java")
        resources.srcDir project(":common").file("src/gametest/resources")
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // The tests call Cobblemon's Kotlin API; Kotlin for Forge provides the runtime (dev runs above)
    gametestCompileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.9.21"
}

loom {
    mods {
        palworks_gametest {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTest {
            server()
            name "Game Test"
            source sourceSets.gametest
            runDir "build/run/gameTest"
            property "neoforge.gameTestServer", "true"
            property "neoforge.enableGameTest", "true"
            property "neoforge.enabledGameTestNamespaces", "palworks_gametest"
            // JUnit-style report, like Fabric's, next to the unit tests' results
            property "palworks.gametest.report", layout.buildDirectory.file("test-results/gametest/TEST-gametest.xml").get().asFile.absolutePath
        }
    }
}

// Stress test (see StressGameTests and "Performance" in CONTRIBUTING): 200 workers of many species,
// with spark measuring tick times, in two scenarios: `dense` (one packed farm) and `spread` (40 small
// bases far apart). Its own source set and mod (palworks_stress, never published, src/stress), so it
// runs only that (by its template namespace): the in-game test mod is loaded too, for its helpers,
// but none of its tests run. `./gradlew :neoforge:runStressTest` runs both scenarios
// (runStressDense, then runStressSpread), each in its own server so one's workers can't add to the
// other's load, and each writes its results to build/stress/<scenario>.json.
def stressScenarios = ["dense", "spread"]

sourceSets {
    stress {
        java.srcDir project(":common").file("src/stress/java")
        resources.srcDir project(":common").file("src/stress/resources")
        // The in-game tests' helpers come from their own mod (palworks_gametest), loaded alongside:
        // NeoForge loads each mod as a module, and two can't hold the same package
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.gametest.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    stressCompileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.9.21"
    // spark's API, bundled in its jar, to read tick times (spark itself is in dev runs, above)
    stressCompileOnly("maven.modrinth:spark:1.10.124-neoforge-1.21.1") { transitive = false }
}

loom {
    mods {
        palworks_stress {
            sourceSet sourceSets.stress
        }
    }
    runs {
        stressScenarios.each { scenario ->
            create("stress${scenario.capitalize()}") {
                server()
                name "Stress Test (${scenario})"
                source sourceSets.stress
                runDir "build/run/stress/${scenario}"
                property "neoforge.gameTestServer", "true"
                property "neoforge.enableGameTest", "true"
                property "neoforge.enabledGameTestNamespaces", "palworks_stress"
                property "palworks.gametest.report", layout.buildDirectory.file("test-results/stress/TEST-${scenario}.xml").get().asFile.absolutePath
                property "palworks.stress.scenario", scenario
                property "palworks.stress.report", layout.buildDirectory.file("stress/${scenario}.json").get().asFile.absolutePath
            }
        }
    }
}

// Loom's NeoForge dev runs load every mod in loom.mods, whichever run it is: the in-game tests'
// server loads the stress test mod too, and the other way round (the stress test needs it anyway,
// for its mixin letting Cobblemon's packets reach mock players). So every run builds both first:
// NeoForge stops at a mod folder that isn't there, and the server never exits. Each run's own
// namespace filter keeps the other's tests from running.
tasks.matching { it.name.startsWith("run") }.configureEach {
    dependsOn "gametestClasses", "stressClasses"
}

// A fresh run directory each time (its world, and spark's profile from the last run, go), and spark
// set up for measuring
stressScenarios.each { scenario ->
    tasks.matching { it.name == "runStress${scenario.capitalize()}" }.configureEach {
        doFirst {
            def dir = file("build/run/stress/${scenario}")
            delete dir
            dir.mkdirs()
            // spark: never upload a profile (bytebin is spark's public paste site; nothing listens on
            // port 9), and no background profiler adding to the load being measured
            def spark = new File(dir, "config/spark")
            spark.mkdirs()
            new File(spark, "config.json").text = '{"backgroundProfiler": false, "bytebinUrl": "http://127.0.0.1:9/", "bytesocksHost": "127.0.0.1:9"}\n'
            delete layout.buildDirectory.file("stress/${scenario}.json")
        }
    }
}
tasks.matching { it.name == "runStressSpread" }.configureEach { mustRunAfter "runStressDense" }
tasks.register("runStressTest") {
    group = "neoforge"
    description = "Runs every stress test scenario, each in its own server"
    dependsOn stressScenarios.collect { "runStress${it.capitalize()}" }
}
