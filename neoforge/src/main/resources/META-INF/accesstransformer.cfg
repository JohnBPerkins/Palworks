# Furnace burn-time fields, so Kindling workers can set burn time without reflection.
# NeoForge runs on Mojang mappings, so these use the Mojang field names.
# (Fabric gets the same access via the palworks.accesswidener; this AT is the NeoForge equivalent.)
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litTime
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litDuration
# A brewing stand's charges and brew time, so Kindling workers can light one (BrewingStandHelper).
public net.minecraft.world.level.block.entity.BrewingStandBlockEntity fuel
public net.minecraft.world.level.block.entity.BrewingStandBlockEntity brewTime
# A navigation's target, cleared while a worker walks one of Palworks' own paths (WorkerNavigator).
public net.minecraft.world.entity.ai.navigation.PathNavigation targetPos
# A chest's count of who has it open, so a worker at one is counted as a player is (ChestHelper).
public net.minecraft.world.level.block.entity.ChestBlockEntity openersCounter
