license = "MIT"

[[mods]]
modId = "palworks"
version = "${version}"
displayName = "Palworks"
displayURL = "https://github.com/JohnBPerkins/Palworks"
authors = "JohnBPerkins"
description = '''
Turns your Cobblemon Pokémon into workers. Send one out and it finds jobs nearby on its own: lighting furnaces, planting and harvesting crops, chopping trees, and carrying items to your chests.
'''

[[dependencies.palworks]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.palworks]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.palworks]]
modId = "cobblemon"
type = "required"
versionRange = "[1.7.0,1.9)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "palworks-common.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
