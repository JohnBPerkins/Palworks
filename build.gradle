plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.3.0' apply false
    id 'com.diffplug.spotless' version '8.10.0'
    id 'net.ltgt.errorprone' version '5.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

// Formatting: `./gradlew spotlessApply` formats every Java file, `spotlessCheck` (part of `check`)
// fails if any isn't formatted. Configured once here rather than per subproject, so the shared
// GameTest sources (common/src/gametest, compiled only by the loaders) are covered too.
spotless {
    java {
        target '*/src/**/*.java'
        palantirJavaFormat('2.102.0')
    }
}

// Everything the pre-commit hook and CI's lint job check: formatting, Error Prone (it runs while
// compiling, and PMD needs the compiled classes) and PMD, on every source set of every module.
tasks.register('lint') {
    group = 'verification'
    description = 'Checks formatting, and runs Error Prone and PMD on all Java sources.'
    dependsOn 'spotlessCheck'
    dependsOn { subprojects.collect { it.tasks.withType(Pmd) } }
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenLocal()
        mavenCentral()

        // Mod-hosting repositories are limited to the groups they actually serve. Otherwise
        // Gradle asks every one of them for every dependency, and if any host is slow or
        // unreachable (impactdev intermittently times out from GitHub runners) the whole build
        // fails while looking up an unrelated library there.
        exclusiveContent {
            forRepository { maven { name = "ImpactDev"; url = "https://maven.impactdev.net/repository/development/" } }
            filter {
                includeGroup "com.cobblemon"
                includeGroup "com.bedrockk" // Cobblemon's MoLang library
            }
        }
        exclusiveContent {
            forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
            filter { includeGroup "maven.modrinth" }
        }
        exclusiveContent {
            forRepository { maven { name = "CurseMaven"; url = "https://cursemaven.com" } }
            filter { includeGroup "curse.maven" }
        }
    }

    configurations.configureEach {
        resolutionStrategy.force("dev.architectury:architectury-transformer:5.2.88")
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    // There's no Kotlin code in Palworks: Loom only remaps the Kotlin metadata inside mod jars when
    // this plugin is applied. Without it, Cobblemon's metadata keeps production names (class_2960)
    // and Cobblemon crashes in dev runs as soon as it uses Kotlin reflection. Applied to every
    // subproject because they share one cache of remapped mod jars.
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    // Linting: Error Prone runs inside every Java compile (configured below); PMD runs as
    // `pmdMain`/`pmdTest`/`pmdGametest`, all part of `check`. `./gradlew lint` runs them all.
    apply plugin: 'net.ltgt.errorprone'
    apply plugin: 'pmd'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        errorprone "com.google.errorprone:error_prone_core:2.51.0"
    }

    tasks.withType(JavaCompile).configureEach {
        // Any compiler warning fails the build (Error Prone's included), so they get fixed rather
        // than pile up. To silence one that's intentional, use @SuppressWarnings("CheckName").
        options.compilerArgs << '-Werror'
        options.errorprone {
            // Mixin handlers are called by the injected code, not by anything Error Prone can see.
            option('UnusedMethod:ExemptingMethodAnnotations', 'org.spongepowered.asm.mixin.injection.Inject,org.spongepowered.asm.mixin.injection.ModifyConstant')
            option('Unused:methodAnnotationsExemptingParameters', 'org.spongepowered.asm.mixin.injection.Inject,org.spongepowered.asm.mixin.injection.ModifyConstant')
        }
    }

    pmd {
        toolVersion = '7.28.0'
        ruleSetFiles = rootProject.files('config/pmd/ruleset.xml')
        ruleSets = []
        consoleOutput = true
    }

    // Gives PMD the JDK's classes for type resolution (Gradle doesn't), which also silences its
    // "Adding current platform jrt-fs.jar to auxClasspath" warning.
    dependencies {
        def jdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        pmdAux files(jdk.map { it.metadata.installationPath.file('lib/jrt-fs.jar') })
    }

    // PMD only logs a file it couldn't check (a broken rule property, a parse error) and passes
    // the build, so a misconfigured rule would quietly check nothing. Fail on those too.
    tasks.withType(Pmd).configureEach { task ->
        reports.xml.required = true
        doLast {
            def report = task.reports.xml.outputLocation.get().asFile
            def errors = report.exists() ? new groovy.xml.XmlSlurper().parse(report).error : []
            if (errors.size() > 0) {
                throw new GradleException("PMD couldn't check ${errors.size()} file(s); the first: " +
                        "${errors[0].@filename}: ${errors[0].@msg}")
            }
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
