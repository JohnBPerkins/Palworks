# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
# Version for local and CI dev builds only. Releases get their version from the vX.Y.Z git tag:
# the Release workflow passes it in with -Pmod_version (see "Releasing" in .github/CONTRIBUTING.md).
mod_version = 0.0.0-dev
maven_group = dev.palworks
archives_name = palworks
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.1

# Dependencies
# Oldest supported Cobblemon. Releases are compiled against it, so Palworks can't use anything
# newer by accident; CI also compiles and boot-tests the newest supported version (see build.yml).
cobblemon_version = 1.7.1
architectury_api_version = 13.0.8
fabric_loader_version = 0.18.4
fabric_api_version = 0.116.7+1.21.1
neoforge_version = 21.1.215
