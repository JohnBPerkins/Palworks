architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/palworks.accesswidener")
}

dependencies {
    mappings loom.officialMojangMappings()

    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Cobblemon's own common module (artifact `mod`), the counterpart of this project. Not the
    // Fabric jar: Loom shares remapped mod jars between projects, and remapping the Fabric jar here
    // (without Fabric API on the classpath) left it broken for the Fabric dev runs.
    // Version comes from gradle.properties (cobblemon_version); CI also builds against the newest
    // supported Cobblemon. Non-transitive: Cobblemon's runtime libraries aren't needed to compile.
    modCompileOnly("com.cobblemon:mod:${rootProject.cobblemon_version}+${rootProject.minecraft_version}") { transitive = false }
    // Cobblemon's MoLang library. Bundled inside Cobblemon's loader jars (so it's there at runtime),
    // but not in the common artifact. Same version in every supported Cobblemon (1.7.0 to 1.8.x).
    compileOnly("com.bedrockk:molang:1.1.20")

    // Kotlin stdlib for Cobblemon API interop (provided at runtime by Cobblemon)
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:1.9.21")

    // Unit tests for pure logic (no running game required).
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// The wiki (see "Wiki" in .github/CONTRIBUTING.md): the hand-written pages in wiki/ with their generated tables filled
// in, plus a page per work skill listing every Pokémon that can do it, written to build/wiki. The
// generator lives in the test sources so it isn't in the mod jar; it reads Cobblemon's species data
// straight from its jar (wiki_cobblemon_version), so it needs no game.
def wikiCobblemon = configurations.detachedConfiguration(
        dependencies.create("com.cobblemon:mod:${rootProject.wiki_cobblemon_version}+${rootProject.minecraft_version}"))
wikiCobblemon.transitive = false

tasks.register('generateWiki', JavaExec) {
    group = 'documentation'
    description = 'Builds the wiki pages, with their Pokémon tables, into build/wiki.'
    def pages = rootProject.file('wiki')
    def out = rootProject.layout.buildDirectory.dir('wiki')
    inputs.files(wikiCobblemon)
    inputs.dir(pages)
    outputs.dir(out)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.palworks.wiki.WikiGenerator'
    argumentProviders.add({
        [wikiCobblemon.singleFile.path, rootProject.wiki_cobblemon_version, pages.path, out.get().asFile.path]
    } as CommandLineArgumentProvider)
}
