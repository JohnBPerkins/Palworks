architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/palworks.accesswidener")
}

dependencies {
    mappings loom.officialMojangMappings()

    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Cobblemon API for suitability detection
    // Version comes from gradle.properties (cobblemon_version); CI also builds against the newest
    // supported Cobblemon. Non-transitive: Cobblemon's runtime libraries aren't needed to compile.
    modCompileOnly("com.cobblemon:fabric:${rootProject.cobblemon_version}+${rootProject.minecraft_version}") { transitive = false }

    // Kotlin stdlib for Cobblemon API interop (provided at runtime by Cobblemon)
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:1.9.21")

    // Unit tests for pure logic (no running game required).
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}
