architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/palworks.accesswidener")
}

dependencies {
    mappings loom.officialMojangMappings()

    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Cobblemon's own common module (artifact `mod`), the counterpart of this project. Not the
    // Fabric jar: Loom shares remapped mod jars between projects, and remapping the Fabric jar here
    // (without Fabric API on the classpath) left it broken for the Fabric dev runs.
    // Version comes from gradle.properties (cobblemon_version); CI also builds against the newest
    // supported Cobblemon. Non-transitive: Cobblemon's runtime libraries aren't needed to compile.
    modCompileOnly("com.cobblemon:mod:${rootProject.cobblemon_version}+${rootProject.minecraft_version}") { transitive = false }
    // Cobblemon's MoLang library. Bundled inside Cobblemon's loader jars (so it's there at runtime),
    // but not in the common artifact. Same version in every supported Cobblemon (1.8.0 to 1.8.x).
    compileOnly("com.bedrockk:molang:1.1.20")

    // Kotlin stdlib for Cobblemon API interop (provided at runtime by Cobblemon)
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:1.9.21")

    // Unit tests for pure logic (no running game required).
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// The wiki (see "Wiki" in .github/CONTRIBUTING.md): the hand-written pages in wiki/ with their generated tables filled
// in, plus a page per work skill listing every Pokémon that can do it, written to build/wiki. The
// generator lives in the test sources so it isn't in the mod jar; it reads Cobblemon's species data
// straight from its jar (wiki_cobblemon_version), so it needs no game.
def wikiCobblemon = configurations.detachedConfiguration(
        dependencies.create("com.cobblemon:mod:${rootProject.wiki_cobblemon_version}+${rootProject.minecraft_version}"))
wikiCobblemon.transitive = false

tasks.register('generateWiki', JavaExec) {
    group = 'documentation'
    description = 'Builds the wiki pages, with their Pokémon tables, into build/wiki.'
    def pages = rootProject.file('wiki')
    def out = rootProject.layout.buildDirectory.dir('wiki')
    inputs.files(wikiCobblemon)
    inputs.dir(pages)
    outputs.dir(out)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.palworks.wiki.WikiGenerator'
    argumentProviders.add({
        [wikiCobblemon.singleFile.path, rootProject.wiki_cobblemon_version, pages.path, out.get().asFile.path]
    } as CommandLineArgumentProvider)
}

// The reference library's generated lists, for checking work skills: every Pokémon and form with
// its levels (generatePokemonList, dev.palworks.wiki.PokemonList) and every job type with the skill
// it needs (generateJobList, JobList). Some of their columns are filled in by hand, which
// regenerating keeps. They go to .claude/.references/data/ in the main checkout, even when run from a
// worktree: the library is gitignored and lives only there. -P<property>=<file> writes one elsewhere.
def root = rootProject.projectDir
def referenceList = { String property, String name ->
    def out = providers.gradleProperty(property).orNull
    if (out != null) {
        return new File(out).isAbsolute() ? out : new File(root, out).path
    }
    // The main checkout: this one, or (in a worktree, whose .git is a file naming its git
    // directory, whose commondir names the repository's) the one whose .git that is
    def main = root
    def dotGit = new File(root, '.git')
    if (dotGit.isFile()) {
        def gitDir = new File(dotGit.text.trim().substring('gitdir:'.length()).trim())
        def commonDir = new File(gitDir, 'commondir')
        main = (commonDir.isFile() ? new File(gitDir, commonDir.text.trim()) : gitDir).canonicalFile.parentFile
    }
    return new File(main, ".claude/.references/data/${name}").path
}

tasks.register('generatePokemonList', JavaExec) {
    group = 'documentation'
    description = 'Lists every Cobblemon species and form with its work skill levels, into the reference library.'
    inputs.files(wikiCobblemon)
    outputs.upToDateWhen { false } // it reads and rewrites the same file
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.palworks.wiki.PokemonList'
    argumentProviders.add({
        [wikiCobblemon.singleFile.path, referenceList('pokemonList', 'pokemon-work-skills.csv')]
    } as CommandLineArgumentProvider)
}

tasks.register('generateJobList', JavaExec) {
    group = 'documentation'
    description = 'Lists every job type with the work skill it needs, into the reference library.'
    outputs.upToDateWhen { false } // it reads and rewrites the same file
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.palworks.wiki.JobList'
    argumentProviders.add({ [referenceList('jobList', 'job-types.csv')] } as CommandLineArgumentProvider)
}
